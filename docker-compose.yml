name: goods-api

services:
  goods-api:
    image: ghcr.io/dongxiujiang/good-api:latest
    container_name: goods-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${GOODS_DATA_DIR:-/home/admin/goods-api/data}:/app/data
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
